name: Publish verified desktop release

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-verified-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - name: Require matching tag and successful production preview
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$tag_sha" = "$RELEASE_SHA"
          gh api "repos/$GH_REPO/actions/workflows/production-smoke.yml/runs?head_sha=$RELEASE_SHA&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.event == "workflow_dispatch") | .head_sha' | grep -Fxq "$RELEASE_SHA"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Require Windows Store submission from the same release run
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | select(.name == "Windows Store submission / msix" and .conclusion == "success") | .name' \
            | grep -Fxq 'Windows Store submission / msix'
          gh api "repos/$GH_REPO/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" --paginate \
            --jq '.artifacts[] | select(.name == "microsoft-store-submission-x64" and .expired == false) | .name' \
            | grep -Fxq 'microsoft-store-submission-x64'
          {
            echo '## Platform readiness'
            echo "Mac, Linux, and Windows Store packages passed in release run $RELEASE_RUN_ID."
            echo 'Windows submission: download microsoft-store-submission-x64 from that run for Partner Center.'
            echo 'Microsoft Store review and Windows installation/update verification remain separate; this publishes only the verified GitHub downloads.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Download and verify release assets
        run: |
          set -euo pipefail
          mkdir artifacts
          gh release download "$RELEASE_TAG" --dir artifacts
          cd artifacts
          sha256sum --check SHA256SUMS.txt
          version="${RELEASE_TAG#v}"
          for arch in arm64 x64; do
            test -s "LeagueSagaImportHelper-$version-mac-$arch.dmg"
            test -s "LeagueSagaImportHelper-$version-mac-$arch.zip"
            grep -Fq "LeagueSagaImportHelper-$version-mac-$arch.zip" latest-mac.yml
          done
          test -s "LeagueSagaImportHelper-$version-linux-x86_64.AppImage"
          test -s "LeagueSagaImportHelper-$version-linux-amd64.deb"
          test -s "LeagueSagaImportHelper-$version-linux-x86_64.rpm"
          grep -Fq "LeagueSagaImportHelper-$version-linux-x86_64.AppImage" latest-linux.yml
          grep -Fq "LeagueSagaImportHelper-$version-linux-amd64.deb" latest-linux.yml
          grep -Fq "LeagueSagaImportHelper-$version-linux-x86_64.rpm" latest-linux.yml
      - name: Publish verified release
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
