name: Notarization status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history:
    runs-on: macos-15
    steps:
      - name: Read Apple notarization history
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          xcrun notarytool history --key "$key" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --output-format json
