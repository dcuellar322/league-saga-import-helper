name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build (tags default to macOS and Linux)
        type: choice
        options: [desktop, macos, linux, all]
        default: desktop

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "$GITHUB_REF_NAME"
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build

  macos:
    if: inputs.platforms != 'linux'
    needs: quality
    runs-on: macos-15
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require signing and notarization credentials
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm run build:contract
      - run: npm -w apps/desktop run make -- --mac --x64 --arm64 --publish never -c.forceCodeSigning=true -c.dmg.sign=true -c.dmg.writeUpdateInfo=false
      - name: Verify apps and notarize signed disk images
        run: |
          for app in apps/desktop/dist/mac*/"LeagueSaga Import Helper.app"; do
            codesign --verify --deep --strict --verbose=2 "$app"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
          done
          for dmg in apps/desktop/dist/*.dmg; do
            codesign --verify --strict --verbose=2 "$dmg"
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  verify-macos:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: macos
          path: artifacts
      - name: Verify and launch downloaded installer and updater app
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/installer"
          mkdir -p "$mount"
          dmg=(artifacts/*-mac-"$RELEASE_ARCH".dmg)
          xcrun stapler validate "${dmg[0]}"
          hdiutil attach "${dmg[0]}" -mountpoint "$mount" -nobrowse -readonly
          trap 'hdiutil detach "$mount"' EXIT
          ditto "$mount/LeagueSaga Import Helper.app" "$RUNNER_TEMP/installed/LeagueSaga Import Helper.app"
          zip=(artifacts/*-mac-"$RELEASE_ARCH".zip)
          ditto -x -k "${zip[0]}" "$RUNNER_TEMP/updater"
          for directory in installed updater; do
            app="$RUNNER_TEMP/$directory/LeagueSaga Import Helper.app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/signature.txt"
            grep -q 'Authority=Developer ID Application:' "$RUNNER_TEMP/signature.txt"
            grep -q 'flags=.*runtime' "$RUNNER_TEMP/signature.txt"
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
            "$app/Contents/MacOS/$executable" --smoke-test "leaguesaga-import://start?apiBase=https%3A%2F%2Fportal.leaguesaga.com&token=smoke-token&leagueId=424242&startYear=2025&importSessionId=smoke-session"
          done

  windows:
    if: inputs.platforms == 'all'
    needs: quality
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require signing credentials
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - run: npm run build:contract
      - run: npm -w apps/desktop run make -- --win --x64 --publish never -c.forceCodeSigning=true
      - name: Smoke test packaged app and deep link
        shell: bash
        run: |
          "apps/desktop/dist/win-unpacked/LeagueSaga Import Helper.exe" --smoke-test "leaguesaga-import://start?apiBase=https%3A%2F%2Fportal.leaguesaga.com&token=smoke-token&leagueId=424242&startYear=2025&importSessionId=smoke-session"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  linux:
    if: inputs.platforms != 'macos'
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:contract
      - run: sudo apt-get update -qq && sudo apt-get install -y rpm
      - run: npm -w apps/desktop run make -- --linux --x64 --publish never
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.rpm
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  verify-linux:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: linux-x64
          path: artifacts
      - name: Install and verify Linux packages
        run: bash scripts/verify-linux.sh artifacts

  verify-linux-distros:
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12-slim', 'debian:13-slim', 'fedora:44']
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: linux-x64
          path: artifacts
      - name: Install and launch on the target distribution
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --cap-add=SYS_ADMIN --security-opt seccomp=unconfined \
            -v "$GITHUB_WORKSPACE/scripts:/checks:ro" \
            -v "$GITHUB_WORKSPACE/artifacts:/artifacts:ro" \
            "$DISTRO_IMAGE" bash /checks/verify-linux-container.sh

  publish:
    if: >-
      always() && startsWith(github.ref, 'refs/tags/') &&
      (needs.verify-macos.result == 'success' || (inputs.platforms == 'linux' && needs.verify-macos.result == 'skipped')) &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped') &&
      ((needs.verify-linux.result == 'success' && needs.verify-linux-distros.result == 'success') ||
      (inputs.platforms == 'macos' && needs.verify-linux.result == 'skipped' && needs.verify-linux-distros.result == 'skipped'))
    needs: [verify-macos, windows, verify-linux, verify-linux-distros]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-artifacts
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > ../SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* SHA256SUMS.txt --draft --verify-tag --generate-notes --title "LeagueSaga Import Helper $GITHUB_REF_NAME"
