name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: startsWith(github.ref, 'refs/tags/')
        run: npm run release:check-version -- "$GITHUB_REF_NAME"
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run typecheck
      - run: npm run build

  macos:
    needs: quality
    runs-on: macos-latest
    env:
      CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require signing and notarization credentials
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD" && test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
      - name: Prepare App Store Connect API key
        run: |
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: npm -w apps/desktop run make -- --mac --x64 --arm64
      - name: Smoke test packaged app and deep link
        run: |
          executable=$(find apps/desktop/dist -type f -path '*/LeagueSaga Import Helper.app/Contents/MacOS/LeagueSaga Import' -print -quit)
          test -n "$executable"
          "$executable" --smoke-test "leaguesaga-import://start?apiBase=https%3A%2F%2Fportal.leaguesaga.com&token=smoke-token&leagueId=424242&startYear=2025&importSessionId=smoke-session"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: macos
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  windows:
    needs: quality
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require signing credentials
        shell: bash
        run: test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
      - run: npm -w apps/desktop run make -- --win --x64
      - name: Smoke test packaged app and deep link
        shell: bash
        run: |
          "apps/desktop/dist/win-unpacked/LeagueSaga Import Helper.exe" --smoke-test "leaguesaga-import://start?apiBase=https%3A%2F%2Fportal.leaguesaga.com&token=smoke-token&leagueId=424242&startYear=2025&importSessionId=smoke-session"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm -w apps/desktop run make -- --linux --x64
      - name: Smoke test packaged app and deep link
        run: |
          xvfb-run "apps/desktop/dist/linux-unpacked/league-saga-import-helper" --smoke-test "leaguesaga-import://start?apiBase=https%3A%2F%2Fportal.leaguesaga.com&token=smoke-token&leagueId=424242&startYear=2025&importSessionId=smoke-session"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: linux-x64
          path: |
            apps/desktop/dist/*.AppImage
            apps/desktop/dist/*.deb
            apps/desktop/dist/*.zip
            apps/desktop/dist/latest*.yml
            apps/desktop/dist/*.blockmap
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        run: find release-artifacts -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* SHA256SUMS.txt --verify-tag --generate-notes --title "LeagueSaga Import Helper $GITHUB_REF_NAME"
