name: Production upload smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: production-smoke
    env:
      LEAGUESAGA_SMOKE_TOKEN: ${{ secrets.LEAGUESAGA_SMOKE_TOKEN }}
      LEAGUESAGA_SMOKE_SESSION_ID: ${{ secrets.LEAGUESAGA_SMOKE_SESSION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:contract
      - name: Require an approved one-time smoke session
        run: test -n "$LEAGUESAGA_SMOKE_TOKEN" && test -n "$LEAGUESAGA_SMOKE_SESSION_ID"
      - run: npm run smoke:production-upload
